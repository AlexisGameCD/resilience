global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    platform: resilience-alpha

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-api:8000"]
        labels:
          service: payment-api

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8000"]
        labels:
          service: auth-service

  - job_name: detection-service
    metrics_path: /metrics
    static_configs:
      - targets: ["detection-service:8000"]
        labels:
          service: detection-service

  - job_name: remediation-service
    metrics_path: /metrics
    static_configs:
      - targets: ["remediation-service:8000"]
        labels:
          service: remediation-service

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
