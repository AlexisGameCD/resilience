# Regles personnalisees RESILIENCE-ALPHA (complement a OWASP CRS).
# Placees dans la plage d'identifiants utilisateur (>= 1000000) pour ne pas entrer
# en conflit avec les regles CRS. IMPORTANT : chaque SecRule tient sur UNE seule
# ligne. libmodsecurity v3 (connecteur nginx) est strict sur les continuations
# de ligne par backslash ; une continuation mal interpretee fait deborder
# l'analyseur sur le fichier de regles suivant. Ces regles rendent le blocage
# DETERMINISTE et TRACABLE pour la demonstration, et taguent les evenements
# pour la correlation SIEM.

# 1. Traversee de repertoire
SecRule REQUEST_URI "@contains ../" "id:1000100,phase:1,deny,status:403,log,msg:'RESILIENCE-ALPHA traversee de repertoire',tag:'resilience-alpha',tag:'attack-lab',tag:'MITRE/T1190',severity:'CRITICAL'"

# 2. Motifs d'injection SQL frequents (CRS couvre deja ; renfort explicite et tague)
SecRule ARGS|REQUEST_BODY "@rx (?i:(union\s+select|or\s+1\s*=\s*1|'\s*or\s*'1'\s*=\s*'1|;\s*drop\s+table))" "id:1000101,phase:2,deny,status:403,log,msg:'RESILIENCE-ALPHA motif injection SQL',tag:'resilience-alpha',tag:'attack-lab',tag:'MITRE/T1190',severity:'CRITICAL'"

# 3. Outils offensifs connus a l'entete User-Agent (dont le marqueur du labo)
SecRule REQUEST_HEADERS:User-Agent "@rx (?i:(sqlmap|nikto|nmap|resilience-redteam))" "id:1000102,phase:1,deny,status:403,log,msg:'RESILIENCE-ALPHA outil offensif detecte',tag:'resilience-alpha',tag:'attack-lab',tag:'MITRE/T1595',severity:'WARNING'"

# 4. Charge utile anormalement volumineuse sur l'endpoint de paiement (regle chainee)
SecRule REQUEST_URI "@beginsWith /payments" "id:1000103,phase:1,chain,deny,status:413,log,msg:'RESILIENCE-ALPHA charge utile excessive sur /payments',tag:'resilience-alpha',tag:'attack-lab',severity:'WARNING'"
    SecRule REQUEST_HEADERS:Content-Length "@gt 20000"
