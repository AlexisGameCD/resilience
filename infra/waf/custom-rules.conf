# Regles RESILIENCE-ALPHA (complement a OWASP CRS) - version robuste.
# Chaque SecRule tient sur UNE seule ligne, sans chainage, avec des operateurs
# simples : objectif = garantir le parsing par libmodsecurity v3 (connecteur nginx).
# Les attaques SQLi / XSS classiques restent couvertes par les regles CRS standard.

# Marqueur du labo : le scenario d'attaque envoie ce User-Agent, blocage deterministe
SecRule REQUEST_HEADERS:User-Agent "@contains resilience-redteam" "id:1000102,phase:1,deny,status:403,log,msg:'RESILIENCE-ALPHA marqueur red team',tag:'resilience-alpha',tag:'attack-lab',severity:'CRITICAL'"

# Traversee de repertoire
SecRule REQUEST_URI "@contains ../" "id:1000100,phase:1,deny,status:403,log,msg:'RESILIENCE-ALPHA traversee de repertoire',tag:'resilience-alpha',tag:'attack-lab',severity:'CRITICAL'"

# Outils offensifs connus a l'entete User-Agent
SecRule REQUEST_HEADERS:User-Agent "@rx (?i:(sqlmap|nikto|nmap))" "id:1000103,phase:1,deny,status:403,log,msg:'RESILIENCE-ALPHA scanner detecte',tag:'resilience-alpha',tag:'attack-lab',severity:'WARNING'"
