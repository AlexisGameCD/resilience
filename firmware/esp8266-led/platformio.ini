; Objet connecte RESILIENCE-ALPHA : LED bicolore pilotee par l'etat du back-office.
; IDE : JetBrains CLion + plugin PlatformIO (ouvrir ce dossier comme projet PlatformIO).
;
; Adapter les trois valeurs ci-dessous a votre environnement :
;   WIFI_SSID        : le point d'acces de votre solution (ex. RESILIENCE-G3)
;   WIFI_PASS        : son mot de passe
;   LED_SERVICE_URL  : http://<IP_DU_PC_HOTE>:8085/state

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2          ; Wemos D1 mini : remplacer par d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -D WIFI_SSID=\"RESILIENCE-G3\"
    -D WIFI_PASS=\"changeme\"
    -D LED_SERVICE_URL=\"http://192.168.137.1:8085/state\"
