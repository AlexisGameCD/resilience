server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le navigateur ne parle qu'a l'origine du dashboard ; nginx relaie vers les
    # services internes (jamais exposes directement sur le reseau du groupe).
    location /api/detection/ {
        proxy_pass http://detection-service:8000/;
        proxy_read_timeout 10s;
    }
    location /api/remediation/ {
        proxy_pass http://remediation-service:8000/;
        proxy_read_timeout 10s;
    }
    location /api/assistant/ {
        proxy_pass http://assistant-service:8000/;
        proxy_read_timeout 60s;
    }
}
