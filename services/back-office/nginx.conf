server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # En-tetes de securite. camera=(self) autorise getUserMedia sur cette origine.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # IA de reconnaissance faciale. client_max_body_size : images base64 (enrolement).
    location /api/face/ {
        proxy_pass http://face-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 12m;
        proxy_read_timeout 30s;
    }

    # Etat de la LED bicolore (simulateur et ESP8266).
    location /api/led/ {
        proxy_pass http://led-service:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # Validation du mot de passe : delegation directe a auth-service.
    location = /api/login {
        proxy_pass http://auth-service:8000/login;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
}
